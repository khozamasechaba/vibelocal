    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeLocal</title>
    <script>
      // Restore path encoded by 404.html redirect
      (function () {
        var p = window.location.search.slice(1).split('&')
          .find(function(s){ return s.startsWith('p='); });
        if (p) {
          var path = '/' + decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, path + window.location.hash);
        }
      })();
    </script>
